<style>
:root{
  --bg:#f3f5f8;--card:#fff;--ink:#14202e;--muted:#5d6b7a;--line:#dfe4ea;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(var(--safe-t) + 10px) 14px 10px}
.top-row{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;letter-spacing:.5px;font-size:18px}

.vsel{flex:1;display:flex;justify-content:flex-end}
.vbtn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:0;border-radius:999px;padding:7px 12px;color:#fff;max-width:100%}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}

.pill.ok{background:#d7f3e3;color:#11643a}.pill.warn{background:#fde9c2;color:#7a4c00}.pill.bad{background:#fbd5d5;color:#8a1f1f}.pill.info{background:#d8e7f8;color:#1d4b80}.pill.grey{background:var(--line);color:var(--muted)}
@media (prefers-color-scheme:dark){.pill.ok{background:#11402a;color:#8ce0b0}.pill.warn{background:#4a3405;color:#ffd27a}.pill.bad{background:#4d1717;color:#ffaaaa}.pill.info{background:#15345a;color:#a9cdf5}}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}

/* hoja modal */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}

@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

.fld input,.fld select,.fld textarea{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px}

.fld .chk{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:15px}
.fld .chk input{width:20px;height:20px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lines .ln{display:grid;grid-template-columns:1fr 64px 80px 30px;gap:6px;margin-bottom:6px}
.lines .ln input,.lines .ln select{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:15px;width:100%}
.lines .ln .x{border:0;background:transparent;color:var(--bad);font-size:20px}
.lines .ln2{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:-2px}
.chklist{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--card)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + var(--safe-b));background:#1c2a39;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90%;text-align:center}
.vcard{border-left:6px solid var(--v1)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}

#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%;color:#000;background:#fff;font:11pt/1.35 -apple-system,Helvetica,Arial,sans-serif}
  #printArea h1{font-size:18pt;margin:0 0 4px}
  #printArea h2{font-size:13pt;margin:16px 0 6px;border-bottom:2px solid #0e2a47;padding-bottom:2px}

  #printArea .avoid{page-break-inside:avoid}
}
</style>

<header class="top">

  <a href="#inicio" data-r="inicio"><span class="ic">🏠</span>Inicio</a>
  <a href="#plan" data-r="plan"><span class="ic">🗓️</span>Plan<span id="bdgPlan"></span></a>

<script>
'use strict';
/* ================= Utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const num = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : null; };
const dec = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fKm = n => n == null ? '—' : Math.round(n).toLocaleString('es-ES') + ' km';
const fEur = n => (n || 0).toLocaleString('es-ES', {style: 'currency', currency: 'EUR'});
const fDate = s => { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const addMonths = (iso, m) => { const d = new Date(iso + 'T12:00:00'); d.setMonth(d.getMonth() + m); return d.toISOString().slice(0, 10); };
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const STATUS = {bad: 'Vencido', warn: 'Próximo', ok: 'Al día', grey: 'Sin datos'};

/* ================= Base de datos (IndexedDB) ================= */
const STORES = ['vehicles', 'odometer', 'plan', 'services', 'faults', 'components', 'expenses', 'photos', 'meta'];
const DB = {
  db: null, mem: false,
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('gescar', 1);
        rq.onupgradeneeded = () => STORES.forEach(s => { if (!rq.result.objectStoreNames.contains(s)) rq.result.createObjectStore(s, {keyPath: 'id'}); });
        rq.onsuccess = () => { this.db = rq.result; res(true); };
        rq.onerror = () => { this.mem = true; res(false); };
      } catch (e) { this.mem = true; res(false); }
    });
  },
  tx(store, mode, fn) {
    if (this.mem) return Promise.resolve(null);
    return new Promise((res, rej) => {
      try {
        const t = this.db.transaction(store, mode); const st = t.objectStore(store); const r = fn(st);
        t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
      } catch (e) { rej(e); }
    });
  },
  all(s) { return this.tx(s, 'readonly', st => st.getAll()).then(r => r || []); },
  get(s, id) { return this.tx(s, 'readonly', st => st.get(id)); },
  put(s, o) { return this.tx(s, 'readwrite', st => st.put(o)); },
  del(s, id) { return this.tx(s, 'readwrite', st => st.delete(id)); },
  clear(s) { return this.tx(s, 'readwrite', st => st.clear()); }
};
const S = {vehicles: [], odometer: [], plan: [], services: [], faults: [], components: [], expenses: [], meta: {}};
const memPhotos = {};
async function load() {
  for (const s of STORES) { if (s === 'photos') continue; const rows = await DB.all(s); if (s === 'meta') { S.meta = {}; rows.forEach(r => S.meta[r.id] = r.v); } else S[s] = rows; }
}
async function save(store, obj) { const arr = S[store]; const i = arr.findIndex(x => x.id === obj.id); if (i >= 0) arr[i] = obj; else arr.push(obj); await DB.put(store, obj); }
async function remove(store, id) { S[store] = S[store].filter(x => x.id !== id); await DB.del(store, id); }
async function setMeta(k, v) { S.meta[k] = v; await DB.put('meta', {id: k, v}); }
const cfg = k => ({avisoKm: 1000, avisoDias: 30, kmDia: 40, ...(S.meta.cfg || {})})[k];

/* ================= Fotos ================= */
const urlCache = {};
async function putPhoto(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
  const id = 'ph_' + uid();
  if (DB.mem) memPhotos[id] = blob; else await DB.put('photos', {id, blob});
  return id;
}
async function photoURL(id) {
  if (urlCache[id]) return urlCache[id];
  const rec = DB.mem ? {blob: memPhotos[id]} : await DB.get('photos', id);
  if (!rec || !rec.blob) return '';
  return urlCache[id] = URL.createObjectURL(rec.blob);
}
async function delPhoto(id) { if (DB.mem) delete memPhotos[id]; else await DB.del('photos', id); }
const blobToDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
const dataURLToBlob = async d => (await fetch(d)).blob();
async function fillThumbs(root = document) {
  for (const img of root.querySelectorAll('img[data-ph]')) { if (!img.src) img.src = await photoURL(img.dataset.ph); }
}
const thumbsHTML = ids => (ids && ids.length) ? `<div class="thumbs">${ids.map(id => `<img data-ph="${id}" alt="foto" onclick="event.stopPropagation();viewPhoto('${id}')">`).join('')}</div>` : '';
async function viewPhoto(id) {
  const u = await photoURL(id);
  sheet({title: 'Fotografía', body: `<img src="${u}" style="width:100%;border-radius:12px">`});
}

/* ================= Vehículo activo y cálculos ================= */
const VCOLORS = ['#2b6cb0', '#b0412b', '#2f855a', '#805ad5', '#c05621', '#2c7a7b'];
const curV = () => S.vehicles.find(v => v.id === S.meta.vid) || S.vehicles[0] || null;
const of = (store, v = curV()) => v ? S[store].filter(x => x.vehicleId === v.id) : [];
function kmPoints(v) {
  const p = [];
  if (v.kmInicial != null && v.fechaCompra) p.push({fecha: v.fechaCompra, km: v.kmInicial});
  of('odometer', v).forEach(o => p.push({fecha: o.fecha, km: o.km}));
  of('services', v).forEach(o => o.km != null && p.push({fecha: o.fecha, km: o.km}));
  of('faults', v).forEach(o => o.km != null && p.push({fecha: o.fecha, km: o.km}));
  return p.filter(x => x.fecha && x.km != null).sort((a, b) => a.fecha.localeCompare(b.fecha) || a.km - b.km);
}
function curKm(v = curV()) { if (!v) return null; const p = kmPoints(v); let m = v.kmInicial ?? null; p.forEach(x => { if (m == null || x.km > m) m = x.km; }); return m; }
function kmDia(v = curV()) {
  const p = kmPoints(v); if (p.length >= 2) {
    // últimos ~12 meses si es posible
    const last = p[p.length - 1]; let first = p[0];
    for (const x of p) { if (daysBetween(x.fecha, last.fecha) <= 400) { first = x; break; } }
    const d = daysBetween(first.fecha, last.fecha);
    if (d >= 20 && last.km > first.km) return (last.km - first.km) / d;
  }
  return v?.kmDia || cfg('kmDia');
}
function lastDone(item) {
  const svc = S.services.filter(s => s.vehicleId === item.vehicleId && (s.planIds || []).includes(item.id)).sort((a, b) => b.fecha.localeCompare(a.fecha) || (b.km || 0) - (a.km || 0))[0];
  if (svc) return {fecha: svc.fecha, km: svc.km, svcId: svc.id};
  if (item.baseFecha || item.baseKm != null) return {fecha: item.baseFecha || null, km: item.baseKm ?? null, base: true};
  return null;
}
function planStatus(item) {
  const v = S.vehicles.find(x => x.id === item.vehicleId); const km = curKm(v); const kd = kmDia(v); const hoy = todayISO();
  const ld = lastDone(item);
  const r = {ld, nextKm: null, nextFecha: null, restKm: null, restDias: null, estFecha: null, status: 'grey', pct: 0};
  if (!ld) return r;
  if (item.intKm && ld.km != null) { r.nextKm = ld.km + item.intKm; if (km != null) { r.restKm = r.nextKm - km; r.pct = Math.max(r.pct, (km - ld.km) / item.intKm); } }
  if (item.intMeses && ld.fecha) { r.nextFecha = addMonths(ld.fecha, item.intMeses); r.restDias = daysBetween(hoy, r.nextFecha); r.pct = Math.max(r.pct, daysBetween(ld.fecha, hoy) / (item.intMeses * 30.44)); }
  let est = r.nextFecha;
  if (r.restKm != null) { const f = addDays(hoy, Math.round(r.restKm / kd)); if (!est || f < est) est = f; }
  r.estFecha = est;
  if (r.nextKm == null && r.nextFecha == null) return r;
  const dEst = est ? daysBetween(hoy, est) : null;
  if ((r.restKm != null && r.restKm <= 0) || (r.restDias != null && r.restDias <= 0)) r.status = 'bad';
  else if ((r.restKm != null && r.restKm <= cfg('avisoKm')) || (dEst != null && dEst <= cfg('avisoDias'))) r.status = 'warn';
  else r.status = 'ok';
  return r;
}
function compStatus(c) {
  const v = S.vehicles.find(x => x.id === c.vehicleId); const km = curKm(v); const kd = kmDia(v); const hoy = todayISO();
  const r = {pct: 0, estKm: null, estFecha: null, status: 'grey', motivo: ''};
  const cand = [];
  if (c.vidaKm && c.kmMontaje != null && km != null) { r.pct = Math.max(r.pct, (km - c.kmMontaje) / c.vidaKm); cand.push({km: c.kmMontaje + c.vidaKm, m: 'vida útil km'}); }
  if (c.vidaMeses && c.fechaMontaje) { r.pct = Math.max(r.pct, daysBetween(c.fechaMontaje, hoy) / (c.vidaMeses * 30.44)); cand.push({fecha: addMonths(c.fechaMontaje, c.vidaMeses), m: 'antigüedad'}); }
  // Predictivo por mediciones (regresión lineal valor ~ km)
  const m = c.medida;
  if (m && m.limite != null) {
    const pts = (c.lecturas || []).filter(l => l.km != null && l.valor != null).map(l => [l.km, l.valor]);
    if (m.nuevo != null && c.kmMontaje != null) pts.unshift([c.kmMontaje, m.nuevo]);
    if (pts.length) {
      const lastV = pts.sort((a, b) => a[0] - b[0])[pts.length - 1][1];
      if (m.nuevo != null && m.nuevo !== m.limite) r.pct = Math.max(r.pct, (m.nuevo - lastV) / (m.nuevo - m.limite));
    }
    if (pts.length >= 2) {
      const n = pts.length, sx = pts.reduce((a, p) => a + p[0], 0), sy = pts.reduce((a, p) => a + p[1], 0);
      const sxx = pts.reduce((a, p) => a + p[0] * p[0], 0), sxy = pts.reduce((a, p) => a + p[0] * p[1], 0);
      const den = n * sxx - sx * sx;
      if (den) { const b = (n * sxy - sx * sy) / den, a = (sy - b * sx) / n; if (b < 0) { cand.push({km: (m.limite - a) / b, m: 'tendencia de medidas'}); } }
    }
  }
  let best = null;
  for (const x of cand) {
    const f = x.fecha || (km != null ? addDays(hoy, Math.round((x.km - km) / kd)) : null);
    if (f && (!best || f < best.f)) best = {f, km: x.km ?? (km != null ? km + daysBetween(hoy, x.fecha) * kd : null), m: x.m};
  }
  if (best) { r.estFecha = best.f; r.estKm = best.km; r.motivo = best.m; }
  const d = r.estFecha ? daysBetween(hoy, r.estFecha) : null;
  if (r.pct >= 1 || (d != null && d <= 0)) r.status = 'bad';
  else if (r.pct >= 0.85 || (d != null && d <= Math.max(cfg('avisoDias'), 60))) r.status = 'warn';
  else if (cand.length || r.pct > 0) r.status = 'ok';
  return r;
}
const svcCost = s => (s.lineas || []).reduce((a, l) => a + (l.cant || 1) * (l.precio || 0), 0) + (s.manoObra || 0);
function allCosts(v = curV()) {
  const rows = of('services', v).map(s => ({fecha: s.fecha, km: s.km, cat: s.tipo === 'correctivo' ? 'Reparaciones' : s.tipo === 'predictivo' ? 'Predictivo / diagnosis' : 'Mantenimiento', concepto: s.titulo, importe: svcCost(s), ref: s.id}));
  of('expenses', v).forEach(e => rows.push({fecha: e.fecha, km: e.km, cat: e.categoria, concepto: e.concepto, importe: e.importe || 0, ref: e.id, exp: true}));
  return rows.sort((a, b) => b.fecha.localeCompare(a.fecha));
}
function alerts(v = curV()) {
  if (!v) return [];
  const a = [];
  of('plan', v).filter(p => p.activo !== false).forEach(p => { const st = planStatus(p); if (st.status === 'bad' || st.status === 'warn') a.push({kind: 'plan', item: p, st, status: st.status}); });
  of('components', v).filter(c => c.activo !== false).forEach(c => { const st = compStatus(c); if (st.status === 'bad' || st.status === 'warn') a.push({kind: 'comp', item: c, st, status: st.status}); });
  if (v.itv) { const d = daysBetween(todayISO(), v.itv); if (d <= cfg('avisoDias')) a.push({kind: 'itv', status: d <= 0 ? 'bad' : 'warn', dias: d}); }

  return a.sort((x, y) => (x.status === 'bad' ? 0 : 1) - (y.status === 'bad' ? 0 : 1));
}

/* Formulario genérico */
function fieldHTML(f, val) {
  const id = 'f_' + f.k; const v = val ?? f.def ?? '';
  if (f.type === 'row') return `<div class="f2">${f.fields.map(x => fieldHTML(x, f.vals?.[x.k])).join('')}</div>`;
  if (f.type === 'html') return f.html;
  let inp;
  if (f.type === 'select') inp = `<select id="${id}">${f.opts.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(v) ? 'selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;
  else if (f.type === 'textarea') inp = `<textarea id="${id}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
  else if (f.type === 'check') return `<div class="fld"><label class="chk"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}> ${esc(f.l)}</label></div>`;
  else inp = `<input id="${id}" type="${f.type === 'num' ? 'text' : (f.type || 'text')}" ${f.type === 'num' ? 'inputmode="decimal"' : ''} value="${esc(v)}" placeholder="${esc(f.ph || '')}">`;
  return `<div class="fld"><label for="${id}">${esc(f.l)}</label>${inp}</div>`;
}
function readField(root, f) {
  const el = root.querySelector('#f_' + f.k); if (!el) return undefined;
  if (f.type === 'check') return el.checked;
  if (f.type === 'num') return f.int ? num(el.value) : dec(el.value);
  return el.value.trim();
}
function form({title, fields, vals = {}, onSave, onDelete, extra = '', after}) {
  const flat = []; fields.forEach(f => f.type === 'row' ? f.fields.forEach(x => flat.push(x)) : flat.push(f));
  fields.forEach(f => { if (f.type === 'row') f.vals = vals; });
  const body = fields.map(f => f.type === 'row' ? fieldHTML(f) : fieldHTML(f, vals[f.k])).join('') + extra +
    `<button class="btn block" id="fSave" style="margin-top:8px">Guardar</button>` + (onDelete ? `<button class="btn bad block" id="fDel" style="margin-top:10px">Eliminar</button>` : '');
  const s = sheet({title, body});
  s.querySelector('#fSave').onclick = async () => {
    const out = {}; flat.forEach(f => { if (f.k) out[f.k] = readField(s, f); });
    for (const f of flat) if (f.req && (out[f.k] === '' || out[f.k] == null)) { toast('Falta: ' + f.l); return; }
    const ok = await onSave(out, s); if (ok !== false) { s.close(); render(); }
  };
  if (onDelete) s.querySelector('#fDel').onclick = async () => { if (await ask('¿Eliminar este registro? No se puede deshacer.', 'Eliminar', true)) { await onDelete(); s.close(); render(); } };
  if (after) after(s);
  return s;
}

function linesEditor(s, lines) {

      `<button class="btn sec sm" id="lnAdd">＋ Pieza sustituida</button><p class="note">Si eliges un “componente controlado”, al guardar se reinicia su desgaste (montaje = fecha y km de esta intervención).</p>`;

function formService(s, preset = {}) {

  const fault = s.faultId ? S.faults.find(f => f.id === s.faultId) : null;
  let L, P;
  form({
    title: isNew ? 'Nueva intervención' : 'Intervención',
    vals: s,
    fields: [
      {k: 'tipo', l: 'Tipo de mantenimiento', type: 'select', opts: [['preventivo', 'Preventivo (plan)'], ['correctivo', 'Correctivo (avería/reparación)'], ['predictivo', 'Predictivo (diagnosis/inspección)']]},
      {k: 'titulo', l: 'Descripción', req: true, ph: 'Ej. Revisión 150.000 km'},
      {type: 'row', fields: [{k: 'fecha', l: 'Fecha', type: 'date', req: true}, {k: 'km', l: 'Kilometraje', type: 'num', int: true, req: true}]},
      {k: 'taller', l: 'Taller / quién lo hizo', ph: 'Taller, concesionario o “yo mismo”'},
      {type: 'html', html: `${fault ? `<div class="warnbox">Vinculada a la avería: <b>${esc(fault.titulo)}</b></div>` : ''}<div class="fld"><label>Operaciones del plan realizadas</label><div class="chklist">${plan.map(p => `<label class="chk" style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)"><input type="checkbox" data-pid="${p.id}" ${(s.planIds || []).includes(p.id) ? 'checked' : ''}> ${esc(p.nombre)}</label>`).join('') || '<div class="note">No hay operaciones en el plan</div>'}</div></div>
        <div class="fld"><label>Componentes / materiales sustituidos</label><div class="lines" id="lnBox"></div></div>`},
      {k: 'manoObra', l: 'Mano de obra (€)', type: 'num'},
      {k: 'notas', l: 'Observaciones', type: 'textarea', ph: 'Qué se encontró, recomendaciones del taller, próxima revisión…'},
      {type: 'html', html: photoField + `<div class="fld"><label>Total</label><div id="svTot" style="font-size:20px;font-weight:800">${fEur(svcCost(s))}</div></div>`},
    ],
    after: f => {
      L = linesEditor(f, s.lineas); P = photoEditor(f, s.fotos);
      const upd = () => { const mo = dec(f.querySelector('#f_manoObra').value) || 0; f.querySelector('#svTot').textContent = fEur(L.reduce((a, l) => a + (l.cant || 1) * (l.precio || 0), 0) + mo); };
      f.addEventListener('input', upd); f.addEventListener('click', () => setTimeout(upd, 0));

      const rec = {...s, ...o, fotos: P, id: s.id || uid()};
      await save('services', rec);
      for (const l of rec.lineas) if (l.compId) { const c = S.components.find(x => x.id === l.compId); if (c && (!c.fechaMontaje || rec.fecha >= c.fechaMontaje)) { c.fechaMontaje = rec.fecha; c.kmMontaje = rec.km; c.lecturas = []; if (l.ref) c.ref = l.ref; await save('components', c); } }
      if (rec.faultId) { const ft = S.faults.find(x => x.id === rec.faultId); if (ft && ft.estado !== 'resuelta') { ft.estado = 'resuelta'; ft.serviceId = rec.id; await save('faults', ft); } }
      toast('Intervención guardada');
    },
    onDelete: isNew ? null : async () => { for (const id of s.fotos || []) await delPhoto(id); await remove('services', s.id); },
  });
}

views.km = v => {

  const kd = kmDia(v);
  return `<h2>Registro de kilometraje</h2>
  <div class="grid2" style="margin-bottom:10px"><div class="kpi"><div class="n">${fKm(curKm(v))}</div><div class="l">Actual</div></div><div class="kpi"><div class="n">${Math.round(kd * 30).toLocaleString('es-ES')}</div><div class="l">km / mes (media)</div></div></div>
  ${kmChart(v)}
  <div class="card">${pts.length ? pts.map(o => `<div class="item" onclick="formOdo(S.odometer.find(x=>x.id==='${o.id}'))"><div class="grow"><div class="t">${fKm(o.km)}</div><div class="s">${fDate(o.fecha)}${o.nota ? ' · ' + esc(o.nota) : ''}</div></div></div>`).join('') : '<div class="empty">Sin lecturas. Pulsa “＋ Km” arriba.</div>'}</div>
  <p class="note">Las intervenciones y averías también cuentan como lecturas para calcular el uso medio.</p>`;
};
function kmChart(v) {
  const p = kmPoints(v); if (p.length < 2) return '';
  const W = 340, H = 130, pad = 28; const t0 = new Date(p[0].fecha).getTime(), t1 = new Date(p[p.length - 1].fecha).getTime() || t0 + 1;
  const k0 = Math.min(...p.map(x => x.km)), k1 = Math.max(...p.map(x => x.km)) || k0 + 1;
  const X = f => pad + (new Date(f).getTime() - t0) / Math.max(1, t1 - t0) * (W - pad - 8), Y = k => H - 18 - (k - k0) / Math.max(1, k1 - k0) * (H - 30);
  return `<div class="card"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del kilometraje">

  <label class="btn sec block" style="margin-top:8px">📥 Restaurar desde archivo<input type="file" accept="application/json,.json" hidden onchange="importBackup(this.files[0]);this.value=''"></label>
  <p class="note">Los datos se guardan solo en este iPhone, dentro de la app. Guarda la copia en <b>iCloud Drive</b> (Archivos) para no perderla si borras la app o cambias de teléfono. La copia incluye los dos vehículos, cada uno con su historial separado.</p>`;

async function shareOrDownload(blob, name, mime) {
  const file = new File([blob], name, {type: mime});
  try { if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return true; } } catch (e) { if (e.name === 'AbortError') return false; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); return true; } catch (e) { toast('No se pudo exportar en esta vista'); return false; }
}
async function exportBackup(withPhotos) {
  toast('Preparando copia…');
  const data = {}; for (const s of STORES) if (s !== 'photos' && s !== 'meta') data[s] = S[s];
  const out = {app: 'GESCAR', formato: 1, fecha: new Date().toISOString(), meta: {vid: S.meta.vid, cfg: S.meta.cfg, seeded: true}, data, photos: []};
  if (withPhotos) { const ph = DB.mem ? Object.entries(memPhotos).map(([id, blob]) => ({id, blob})) : await DB.all('photos'); for (const p of ph) out.photos.push({id: p.id, d: await blobToDataURL(p.blob)}); }
  const ok = await shareOrDownload(new Blob([JSON.stringify(out)], {type: 'application/json'}), `GESCAR_copia_${todayISO()}.json`, 'application/json');
  if (ok) { await setMeta('lastBackup', new Date().toISOString()); render(); }
}
async function importBackup(file) {
  if (!file) return;
  let j; try { j = JSON.parse(await file.text()); } catch (e) { toast('Archivo no válido'); return; }
  if (j.app !== 'GESCAR' || !j.data) { toast('No es una copia de GESCAR'); return; }
  const n = (j.data.services || []).length;
  if (!await ask(`Restaurar la copia del ${fDate(j.fecha.slice(0, 10))} (${(j.data.vehicles || []).length} vehículos, ${n} intervenciones). Se SUSTITUIRÁN los datos actuales.`, 'Restaurar', true)) return;
  for (const s of STORES) await DB.clear(s);
  for (const s of STORES) if (s !== 'photos' && s !== 'meta') { S[s] = []; for (const r of j.data[s] || []) await save(s, r); }
  for (const p of j.photos || []) { const blob = await dataURLToBlob(p.d); if (DB.mem) memPhotos[p.id] = blob; else await DB.put('photos', {id: p.id, blob}); }
  S.meta = {}; for (const [k, v] of Object.entries(j.meta || {})) await setMeta(k, v);
  await setMeta('lastBackup', j.fecha);
  toast('Copia restaurada'); location.hash = '#inicio'; render();
}

  return `<h2>Ajustes y avisos</h2>
  <div class="card">
    <div class="f2"><div class="fld"><label>Avisar con (km de antelación)</label><input id="aKm" inputmode="numeric" value="${cfg('avisoKm')}"></div><div class="fld"><label>Avisar con (días de antelación)</label><input id="aDias" inputmode="numeric" value="${cfg('avisoDias')}"></div></div>
    <div class="fld"><label>Uso estimado si aún no hay lecturas (km/día)</label><input id="aKmDia" inputmode="numeric" value="${cfg('kmDia')}"></div>
    <button class="btn block" onclick="saveCfg()">Guardar ajustes</button>
  </div>
  <h3>Avisos automáticos</h3>
  <div class="card">
    <p style="margin-top:0">GESCAR revisa el plan cada vez que abres la app: muestra los avisos en Inicio, pone el número de pendientes en el icono y, si lo permites, lanza una notificación.</p>
    <div class="kv" style="margin-bottom:10px"><span>Notificaciones</span><span>${{granted: '✅ Activadas', denied: '⛔ Bloqueadas en Ajustes del iPhone', default: 'Sin activar', no: 'No disponibles aquí'}[n]}</span></div>
    ${n === 'default' ? `<button class="btn block" onclick="enableNotif()">🔔 Activar notificaciones</button>` : ''}
    <button class="btn sec block" style="margin-top:8px" onclick="exportICS()">📅 Añadir próximos mantenimientos al Calendario</button>
    <p class="note">En iPhone las notificaciones solo funcionan con GESCAR instalada en la pantalla de inicio (iOS 16.4 o superior). Para avisos aunque no abras la app, usa “Añadir al Calendario”: crea un evento con alarma para cada mantenimiento previsto de cada vehículo.</p>
  </div>
  <h3>Instalar en el iPhone</h3>
  <div class="card note" style="font-size:14px">Abre GESCAR en <b>Safari</b> → botón <b>Compartir</b> → <b>Añadir a pantalla de inicio</b>. Se abrirá a pantalla completa y funcionará sin conexión.</div>`;
};
async function saveCfg() { await setMeta('cfg', {avisoKm: num($('#aKm').value) || 1000, avisoDias: num($('#aDias').value) || 30, kmDia: num($('#aKmDia').value) || 40}); toast('Ajustes guardados'); render(); }
async function enableNotif() { try { const p = await Notification.requestPermission(); if (p === 'granted') { await setMeta('notifDay', null); checkNotify(); } render(); } catch (e) { toast('No disponible'); } }
function updateBadge(al) { try { const n = S.vehicles.reduce((a, v) => a + alerts(v).filter(x => x.status === 'bad').length, 0); if (navigator.setAppBadge) n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } catch (e) {} }
async function checkNotify() {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted' || S.meta.notifDay === todayISO()) return;
    const lines = []; S.vehicles.forEach(v => { const a = alerts(v); const b = a.filter(x => x.status === 'bad').length, w = a.length - b; if (a.length) lines.push(`${v.alias}: ${b ? b + ' vencidos' : ''}${b && w ? ', ' : ''}${w ? w + ' próximos' : ''}`); });
    if (!lines.length) return;
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    const opt = {body: lines.join('\n'), icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'gescar-avisos'};
    if (reg) await reg.showNotification('GESCAR · Mantenimiento pendiente', opt); else new Notification('GESCAR · Mantenimiento pendiente', opt);
    await setMeta('notifDay', todayISO());
  } catch (e) {}
}
async function exportICS() {
  const ev = []; const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const icsEsc = s => String(s).replace(/[,;\\]/g, m => '\\' + m).replace(/\n/g, '\\n');
  S.vehicles.forEach(v => {
    of('plan', v).filter(p => p.activo !== false).forEach(p => { const st = planStatus(p); if (!st.estFecha) return; const f = (st.estFecha < todayISO() ? todayISO() : st.estFecha).replace(/-/g, '');
      ev.push(`BEGIN:VEVENT\r\nUID:gescar-${p.id}@gescar\r\nDTSTAMP:${stamp}\r\nDTSTART;VALUE=DATE:${f}\r\nSUMMARY:${icsEsc(`🔧 ${v.alias}: ${p.nombre}`)}\r\nDESCRIPTION:${icsEsc(`Previsto por GESCAR. ${st.nextKm ? 'A los ' + fKm(st.nextKm) + '. ' : ''}${st.nextFecha ? 'Límite por tiempo ' + fDate(st.nextFecha) + '.' : ''}`)}\r\nBEGIN:VALARM\r\nTRIGGER:-P7D\r\nACTION:DISPLAY\r\nDESCRIPTION:${icsEsc(p.nombre)}\r\nEND:VALARM\r\nEND:VEVENT`); });
    if (v.itv) ev.push(`BEGIN:VEVENT\r\nUID:gescar-itv-${v.id}@gescar\r\nDTSTAMP:${stamp}\r\nDTSTART;VALUE=DATE:${v.itv.replace(/-/g, '')}\r\nSUMMARY:${icsEsc('📄 ITV ' + v.alias)}\r\nBEGIN:VALARM\r\nTRIGGER:-P15D\r\nACTION:DISPLAY\r\nDESCRIPTION:ITV\r\nEND:VALARM\r\nEND:VEVENT`);
  });
  if (!ev.length) { toast('No hay mantenimientos con fecha prevista'); return; }
  const ics = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//GESCAR//ES\r\nCALSCALE:GREGORIAN\r\n${ev.join('\r\n')}\r\nEND:VCALENDAR\r\n`;
  await shareOrDownload(new Blob([ics], {type: 'text/calendar'}), 'GESCAR_mantenimientos.ics', 'text/calendar');
}

/* ---------- Botón + contextual ---------- */
function quickAdd() {
  const r = route();
  if (r === 'historial') return formService();
  if (r === 'averias') return formFault();
  if (r === 'plan') return formPlan();
  if (r === 'gastos') return formExpense();
  if (r === 'componentes') return formComp();
  if (r === 'km') return formOdo();
  const s = sheet({title: 'Registrar en ' + (curV().alias || ''), body: `<div class="menu">
    ${[['🔧', 'Intervención / mantenimiento', 'formService()'], ['⚠️', 'Avería', 'formFault()'], ['📍', 'Lectura de kilometraje', 'formOdo()'], ['💶', 'Gasto', 'formExpense()'], ['🔩', 'Medida de componente', "location.hash='#componentes'"]].map(([i, t, fn]) => `<a href="#" data-fn="${fn}"><span class="ic">${i}</span><div>${t}</div></a>`).join('')}</div>`});
  s.querySelectorAll('[data-fn]').forEach(a => a.onclick = e => { e.preventDefault(); s.close(); new Function(a.dataset.fn)(); });
}

/* ================= Arranque ================= */
(async function init() {
  await DB.open();
  if (DB.mem) toast('Aviso: este navegador no permite guardar datos. Se perderán al cerrar.');
  try { await load(); } catch (e) { console.error(e); }
  await seed();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').then(() => checkNotify()).catch(() => checkNotify());
  } else checkNotify();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
})();
</script>
