<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GESCAR · Mantenimiento de vehículos</title>
<meta name="theme-color" content="#07080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GESCAR">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#07080a;--bg2:#0d0f13;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.07);--line:rgba(255,255,255,.09);
  --ink:#f3f1ec;--muted:#8e9098;--gold:#c9a96e;--gold2:#ecd8ad;--ok:#5fd39a;--warn:#f0b85a;--bad:#ff6b6b;--info:#8ab8ff;
  --v1:#c9a96e;--radius:20px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(201,169,110,.10),transparent 60%),radial-gradient(900px 500px at -10% 30%,rgba(90,120,180,.08),transparent 60%),var(--bg);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold2)}
/* Cabecera */
header.top{position:sticky;top:0;z-index:30;padding:calc(var(--safe-t) + 10px) 18px 10px;background:linear-gradient(180deg,rgba(7,8,10,.92),rgba(7,8,10,.65));-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.04)}
.top-row{display:flex;align-items:center;gap:10px}
.logo{font-weight:300;letter-spacing:.42em;font-size:13px;color:var(--ink)}
.logo b{font-weight:700;color:var(--gold)}
.vsel{flex:1;display:flex;justify-content:flex-end}
.vbtn{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;max-width:100%}
.vbtn .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.vbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;letter-spacing:.02em}
.vbtn small{color:var(--muted);font-size:12px;white-space:nowrap}
.vbtn span{max-width:150px}
main{padding:6px 16px calc(110px + var(--safe-b))}
/* Navegación flotante */
nav.tabs{position:fixed;left:14px;right:14px;bottom:calc(10px + var(--safe-b));z-index:30;display:flex;padding:6px;border-radius:26px;background:rgba(20,22,27,.72);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.5)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;border-radius:20px;color:var(--muted);text-decoration:none;font-size:10px;letter-spacing:.06em;text-transform:uppercase;transition:all .3s var(--ease);position:relative}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:#111;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 6px 18px rgba(201,169,110,.35)}
nav.tabs a .bdg{position:absolute;top:2px;right:18%;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;text-align:center;letter-spacing:0}
.fab{position:fixed;right:20px;bottom:calc(92px + var(--safe-b));z-index:25;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#111;box-shadow:0 10px 30px rgba(201,169,110,.45);display:flex;align-items:center;justify-content:center;transition:transform .2s}
.fab:active{transform:scale(.92)}
.fab svg{width:26px;height:26px}
/* Tipografía */
h2{font-size:28px;font-weight:250;letter-spacing:-.01em;margin:14px 2px 4px}
.sub{color:var(--muted);font-size:13px;margin:0 2px 14px}
h3{font-size:11px;font-weight:600;margin:24px 4px 10px;color:var(--gold);text-transform:uppercase;letter-spacing:.24em;display:flex;align-items:center;gap:10px}
h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.22em;color:var(--muted)}
/* Tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.kpi .n{font-size:24px;font-weight:300}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.kpi.bad .n{color:var(--bad)}.kpi.warn .n{color:var(--warn)}.kpi.ok .n{color:var(--ok)}
.row{display:flex;align-items:center;gap:10px}.row .grow{flex:1;min-width:0}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;transition:opacity .2s}
.item:active{opacity:.6}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:550;letter-spacing:.005em}
.item .s{font-size:12.5px;color:var(--muted)}
.item .r{text-align:right;font-size:13px;white-space:nowrap}
.tile{width:44px;height:44px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid var(--line);color:var(--gold2)}
.tile svg{width:24px;height:24px}
.tile.bad{color:var(--bad);box-shadow:inset 0 0 0 1px rgba(255,107,107,.35)}.tile.warn{color:var(--warn);box-shadow:inset 0 0 0 1px rgba(240,184,90,.35)}.tile.ok{color:var(--ok)}
.pill{display:inline-block;font-size:10px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.1em}
.pill.ok{background:rgba(95,211,154,.12);color:var(--ok)}.pill.warn{background:rgba(240,184,90,.14);color:var(--warn)}.pill.bad{background:rgba(255,107,107,.14);color:var(--bad)}.pill.info{background:rgba(201,169,110,.15);color:var(--gold2)}.pill.grey{background:var(--card2);color:var(--muted)}
.bar{height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3fae7c,var(--ok));border-radius:4px;transform-origin:left;animation:grow 1.1s var(--ease) both}
.bar i.warn{background:linear-gradient(90deg,#c9892d,var(--warn))}.bar i.bad{background:linear-gradient(90deg,#c74343,var(--bad))}
@keyframes spinring{to{transform:rotate(360deg)}}
.ring .val[style*=spinring]{transform-origin:60px 60px}
.mini{padding:8px 9px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:14px;width:100%;color-scheme:dark;-webkit-appearance:none;appearance:none}
@keyframes grow{from{transform:scaleX(0)}}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 16px;font-weight:600;letter-spacing:.03em;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#141008;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:rgba(255,107,107,.15);color:var(--bad);border:1px solid rgba(255,107,107,.3)}
.btn.block{display:flex;width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px}
.btn svg{width:18px;height:18px}
.empty{text-align:center;color:var(--muted);padding:24px 10px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:10px;font-size:12.5px;color:var(--muted);transition:all .25s var(--ease)}
.seg button.on{background:var(--card2);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);margin-bottom:12px;font-size:16px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.thumbs img{width:62px;height:62px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.thumbs .ph{position:relative}
.thumbs .ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:12px;line-height:22px;padding:0}
.note{font-size:12px;color:var(--muted)}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,rgba(201,169,110,.13),rgba(201,169,110,.04));color:var(--gold2);border-radius:16px;padding:12px 14px;font-size:13px;margin-bottom:10px;border:1px solid rgba(201,169,110,.25)}
.warnbox svg{width:18px;height:18px;flex:none;margin-top:1px}
/* Hero vehículo */
.stage{margin:0 -16px;overflow-x:auto;scroll-snap-type:x mandatory;display:flex;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.stage::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;padding:6px 16px 0;position:relative}
.hero{position:relative;border-radius:28px;overflow:hidden;min-height:330px;background:radial-gradient(120% 90% at 50% 100%,rgba(255,255,255,.10),transparent 55%),linear-gradient(180deg,#16181d,#0a0b0e);border:1px solid var(--line);isolation:isolate}
.hero .photo{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.06);animation:kenburns 18s ease-in-out infinite alternate;z-index:-2}
@keyframes kenburns{to{transform:scale(1.16) translate(-2%,-1%)}}
.hero.hasPhoto .car,.hero.hasPhoto .glow,.vimg.hasPhoto svg{opacity:0;transition:opacity .6s}
.hero .photo,.vimg .photo{opacity:0;transition:opacity .9s var(--ease)}.hasPhoto>.photo{opacity:1}
.credit{text-align:center;font-size:10px;color:var(--muted);margin:2px 0 0;letter-spacing:.04em}.credit a{color:var(--muted)}
.hero .shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,.15) 60%,rgba(0,0,0,.85) 100%)}
.hero .glow{position:absolute;left:10%;right:10%;bottom:70px;height:80px;border-radius:50%;filter:blur(40px);opacity:.45;z-index:-1}
.hero .car{position:absolute;left:0;right:0;bottom:78px;padding:0 8px;animation:floatIn 1s var(--ease) both}
.hero .car svg{width:100%;height:auto;display:block}
@keyframes floatIn{from{opacity:0;transform:translateX(40px)}}
.hero .hd{position:absolute;top:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start}
.hero .name{font-size:27px;font-weight:200;line-height:1.08;letter-spacing:-.01em;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.hero .name b{display:block;font-weight:650;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.plate{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font:600 12px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.14em;padding:6px 9px 6px 6px;border-radius:7px;background:#f4f4f0;color:#111}
.plate i{font-style:normal;background:#1f4fb4;color:#fff;font-size:8px;padding:4px 3px;border-radius:3px;letter-spacing:0}
.camBtn{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;display:flex;align-items:center;justify-content:center}
.camBtn svg{width:19px;height:19px}
.hero .ft{position:absolute;left:20px;right:20px;bottom:18px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.odo .eyebrow{color:rgba(255,255,255,.6)}
.odo .v{font-size:34px;font-weight:200;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.odo .v small{font-size:13px;color:var(--muted);margin-left:4px;letter-spacing:.1em}
.kmBtn{display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:11px 16px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#141008;font-weight:650;font-size:13px;letter-spacing:.05em;box-shadow:0 8px 24px rgba(201,169,110,.4)}
.kmBtn svg{width:16px;height:16px}
.dots{display:flex;justify-content:center;gap:6px;margin:12px 0 4px}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);transition:all .35s var(--ease)}
.dots i.on{width:22px;background:var(--gold)}
/* Salud */
.health{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .trk{stroke:rgba(255,255,255,.07)}
.ring .val{transition:stroke-dashoffset 1.6s var(--ease)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:32px;font-weight:200;line-height:1}
.ring .c .lb{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.hstats{flex:1;display:grid;gap:8px}
.hstat{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.hstat:last-child{border-bottom:0;padding-bottom:0}
.hstat span{color:var(--muted)}
.hstat b{font-weight:500;font-variant-numeric:tabular-nums}
/* Acciones rápidas */
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 4px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;padding:0;font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.qa button .tile{width:54px;height:54px;border-radius:18px;transition:transform .2s}
.qa button:active .tile{transform:scale(.9)}
.qa button .tile svg{width:26px;height:26px}
/* Carrusel servicios */
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.svc{flex:0 0 172px;scroll-snap-align:start;border-radius:20px;padding:14px;background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer}
.svc::before{content:"";position:absolute;inset:auto -30% -60% auto;width:140px;height:140px;border-radius:50%;filter:blur(30px);opacity:.25;background:var(--ok)}
.svc.bad::before{background:var(--bad);opacity:.35}.svc.warn::before{background:var(--warn);opacity:.3}
.svc .tile{margin-bottom:12px}
.svc .t{font-size:13.5px;font-weight:550;line-height:1.25;min-height:34px}
.svc .big{font-size:21px;font-weight:250;margin-top:8px;font-variant-numeric:tabular-nums}
.svc .s{font-size:11.5px;color:var(--muted)}
/* Timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:linear-gradient(180deg,var(--gold),rgba(201,169,110,.05))}
.tl .ev{position:relative;margin-bottom:12px}
.tl .ev::before{content:"";position:absolute;left:-23px;top:20px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--ok);box-shadow:0 0 12px var(--ok)}
.tl .ev.correctivo::before{border-color:var(--bad);box-shadow:0 0 12px var(--bad)}
.tl .ev.predictivo::before{border-color:var(--info);box-shadow:0 0 12px var(--info)}
.tl .ev .card{margin:0}
.tl .date{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
/* Vista superior componentes */
.topview{position:relative;max-width:260px;margin:0 auto}
.topview svg{width:100%;height:auto;display:block}
.hot{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;cursor:pointer}
.hot::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid currentColor;color:var(--c,#888)}
.hot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c,#888);opacity:0}
.hot.pulse::after{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.5);opacity:0}}
.legend{display:flex;justify-content:center;gap:14px;font-size:11px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
/* Más */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid a{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px 14px;transition:transform .2s}
.mgrid a:active{transform:scale(.97)}
.mgrid a .tile{margin-bottom:14px}
.mgrid a .t{font-weight:600;font-size:14px}
.mgrid a .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.vcard{position:relative;overflow:hidden;cursor:pointer;padding:0}
.vcard .vimg{height:150px;background:linear-gradient(180deg,#17191e,#0b0c0f);position:relative;display:flex;align-items:flex-end;padding:0 10px}
.vcard .vimg .photo{position:absolute;inset:0;background-size:cover;background-position:center}
.vcard .vimg svg{width:100%;position:relative}
.vcard .vb{padding:14px 16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px}
.kv span:nth-child(odd){color:var(--muted)}
/* Animación de entrada */
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
#view.fade{animation:vin .45s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
/* Hoja modal */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fadeBg .25s}
@keyframes fadeBg{from{opacity:0}}
.sheet{background:linear-gradient(180deg,#15171c,#0c0d10);width:100%;max-width:640px;max-height:92vh;border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:up .35s var(--ease);border:1px solid var(--line);border-bottom:0}
@keyframes up{from{transform:translateY(60px);opacity:.3}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:16px 18px 12px;border-bottom:1px solid var(--line);position:relative}
.sheet-h::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:rgba(255,255,255,.18)}
.sheet-h .tt{flex:1;font-weight:300;font-size:21px}
.sheet-b{overflow:auto;padding:14px 18px calc(18px + var(--safe-b));-webkit-overflow-scrolling:touch}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:10.5px;color:var(--muted);margin:0 0 6px 2px;font-weight:600;text-transform:uppercase;letter-spacing:.14em}
.fld input,.fld select,.fld textarea{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:16px;color-scheme:dark;-webkit-appearance:none;appearance:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,110,.18)}
.fld textarea{min-height:76px;resize:vertical}
.fld .chk{display:flex;align-items:center;gap:10px;padding:6px 2px;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:400}
.fld .chk input,.chk input{width:20px;height:20px;accent-color:var(--gold);-webkit-appearance:auto;appearance:auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lines .ln{display:grid;grid-template-columns:1fr 60px 78px 30px;gap:6px;margin-bottom:6px}
.lines .ln input,.lines .ln select{padding:9px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:15px;width:100%;color-scheme:dark}
.lines .ln .x{border:0;background:transparent;color:var(--bad);font-size:18px}
.lines .ln2{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:-2px}

<script>
'use strict';
/* ================= Utilidades ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const num = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : null; };
const dec = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fKm = n => n == null ? '—' : Math.round(n).toLocaleString('es-ES') + ' km';
const fEur = n => (n || 0).toLocaleString('es-ES', {style: 'currency', currency: 'EUR'});
const fDate = s => { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const addMonths = (iso, m) => { const d = new Date(iso + 'T12:00:00'); d.setMonth(d.getMonth() + m); return d.toISOString().slice(0, 10); };
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const STATUS = {bad: 'Vencido', warn: 'Próximo', ok: 'Al día', grey: 'Sin datos'};

/* ================= Base de datos (IndexedDB) ================= */
const STORES = ['vehicles', 'odometer', 'plan', 'services', 'faults', 'components', 'expenses', 'docs', 'photos', 'meta'];
const DB = {
  db: null, mem: false,
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('gescar', 2);
        rq.onupgradeneeded = () => STORES.forEach(s => { if (!rq.result.objectStoreNames.contains(s)) rq.result.createObjectStore(s, {keyPath: 'id'}); });
        rq.onsuccess = () => { this.db = rq.result; res(true); };
        rq.onerror = () => { this.mem = true; res(false); };
      } catch (e) { this.mem = true; res(false); }
    });
  },
  tx(store, mode, fn) {
    if (this.mem) return Promise.resolve(null);
    return new Promise((res, rej) => {
      try {
        const t = this.db.transaction(store, mode); const st = t.objectStore(store); const r = fn(st);
        t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error);
      } catch (e) { rej(e); }
    });
  },
  all(s) { return this.tx(s, 'readonly', st => st.getAll()).then(r => r || []); },
  get(s, id) { return this.tx(s, 'readonly', st => st.get(id)); },
  put(s, o) { return this.tx(s, 'readwrite', st => st.put(o)); },
  del(s, id) { return this.tx(s, 'readwrite', st => st.delete(id)); },
  clear(s) { return this.tx(s, 'readwrite', st => st.clear()); }
};
const S = {vehicles: [], odometer: [], plan: [], services: [], faults: [], components: [], expenses: [], docs: [], meta: {}};
const memPhotos = {};
async function load() {
  for (const s of STORES) { if (s === 'photos') continue; const rows = await DB.all(s); if (s === 'meta') { S.meta = {}; rows.forEach(r => S.meta[r.id] = r.v); } else S[s] = rows; }
}
async function save(store, obj) { const arr = S[store]; const i = arr.findIndex(x => x.id === obj.id); if (i >= 0) arr[i] = obj; else arr.push(obj); await DB.put(store, obj); }
async function remove(store, id) { S[store] = S[store].filter(x => x.id !== id); await DB.del(store, id); }
async function setMeta(k, v) { S.meta[k] = v; await DB.put('meta', {id: k, v}); }
const cfg = k => ({avisoKm: 1000, avisoDias: 30, kmDia: 40, ...(S.meta.cfg || {})})[k];

/* ================= Fotos ================= */
const urlCache = {};
async function putPhoto(file) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
  const id = 'ph_' + uid();
  if (DB.mem) memPhotos[id] = blob; else await DB.put('photos', {id, blob});
  return id;
}
async function photoURL(id) {
  if (urlCache[id]) return urlCache[id];
  const rec = DB.mem ? {blob: memPhotos[id]} : await DB.get('photos', id);
  if (!rec || !rec.blob) return '';
  return urlCache[id] = URL.createObjectURL(rec.blob);
}
async function delPhoto(id) { if (DB.mem) delete memPhotos[id]; else await DB.del('photos', id); }
const blobToDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
const dataURLToBlob = async d => (await fetch(d)).blob();
async function fillThumbs(root = document) {
  for (const img of root.querySelectorAll('img[data-ph]')) { if (!img.src) img.src = await photoURL(img.dataset.ph); }
}
const thumbsHTML = ids => (ids && ids.length) ? `<div class="thumbs">${ids.map(id => `<img data-ph="${id}" alt="foto" onclick="event.stopPropagation();viewPhoto('${id}')">`).join('')}</div>` : '';
async function viewPhoto(id) {
  const u = await photoURL(id);
  sheet({title: 'Fotografía', body: `<img src="${u}" style="width:100%;border-radius:12px">`});
}

/* ================= Vehículo activo y cálculos ================= */
const VCOLORS = ['#2b6cb0', '#b0412b', '#2f855a', '#805ad5', '#c05621', '#2c7a7b'];
const curV = () => S.vehicles.find(v => v.id === S.meta.vid) || S.vehicles[0] || null;
const of = (store, v = curV()) => v ? S[store].filter(x => x.vehicleId === v.id) : [];
function kmPoints(v) {
  const p = [];
  if (v.kmInicial != null && v.fechaCompra) p.push({fecha: v.fechaCompra, km: v.kmInicial});
  of('odometer', v).forEach(o => p.push({fecha: o.fecha, km: o.km}));
  of('services', v).forEach(o => o.km != null && p.push({fecha: o.fecha, km: o.km}));
  of('faults', v).forEach(o => o.km != null && p.push({fecha: o.fecha, km: o.km}));
  return p.filter(x => x.fecha && x.km != null).sort((a, b) => a.fecha.localeCompare(b.fecha) || a.km - b.km);
}
function curKm(v = curV()) { if (!v) return null; const p = kmPoints(v); let m = v.kmInicial ?? null; p.forEach(x => { if (m == null || x.km > m) m = x.km; }); return m; }
function kmDia(v = curV()) {
  const p = kmPoints(v); if (p.length >= 2) {
    // últimos ~12 meses si es posible
    const last = p[p.length - 1]; let first = p[0];
    for (const x of p) { if (daysBetween(x.fecha, last.fecha) <= 400) { first = x; break; } }
    const d = daysBetween(first.fecha, last.fecha);
    if (d >= 20 && last.km > first.km) return (last.km - first.km) / d;
  }
  return v?.kmDia || cfg('kmDia');
}
function lastDone(item) {
  const svc = S.services.filter(s => s.vehicleId === item.vehicleId && (s.planIds || []).includes(item.id)).sort((a, b) => b.fecha.localeCompare(a.fecha) || (b.km || 0) - (a.km || 0))[0];
  if (svc) return {fecha: svc.fecha, km: svc.km, svcId: svc.id};
  if (item.baseFecha || item.baseKm != null) return {fecha: item.baseFecha || null, km: item.baseKm ?? null, base: true};
  return null;
}
function planStatus(item) {
  const v = S.vehicles.find(x => x.id === item.vehicleId); const km = curKm(v); const kd = kmDia(v); const hoy = todayISO();
  const ld = lastDone(item);
  const r = {ld, nextKm: null, nextFecha: null, restKm: null, restDias: null, estFecha: null, status: 'grey', pct: 0};
  if (!ld) return r;
  if (item.intKm && ld.km != null) { r.nextKm = ld.km + item.intKm; if (km != null) { r.restKm = r.nextKm - km; r.pct = Math.max(r.pct, (km - ld.km) / item.intKm); } }
  if (item.intMeses && ld.fecha) { r.nextFecha = addMonths(ld.fecha, item.intMeses); r.restDias = daysBetween(hoy, r.nextFecha); r.pct = Math.max(r.pct, daysBetween(ld.fecha, hoy) / (item.intMeses * 30.44)); }
  let est = r.nextFecha;
  if (r.restKm != null) { const f = addDays(hoy, Math.round(r.restKm / kd)); if (!est || f < est) est = f; }
  r.estFecha = est;
  if (r.nextKm == null && r.nextFecha == null) return r;
  const dEst = est ? daysBetween(hoy, est) : null;
  if ((r.restKm != null && r.restKm <= 0) || (r.restDias != null && r.restDias <= 0)) r.status = 'bad';
  else if ((r.restKm != null && r.restKm <= cfg('avisoKm')) || (dEst != null && dEst <= cfg('avisoDias'))) r.status = 'warn';
  else r.status = 'ok';
  return r;
}
function compStatus(c) {
  const v = S.vehicles.find(x => x.id === c.vehicleId); const km = curKm(v); const kd = kmDia(v); const hoy = todayISO();
  const r = {pct: 0, estKm: null, estFecha: null, status: 'grey', motivo: ''};
  const cand = [];
  if (c.vidaKm && c.kmMontaje != null && km != null) { r.pct = Math.max(r.pct, (km - c.kmMontaje) / c.vidaKm); cand.push({km: c.kmMontaje + c.vidaKm, m: 'vida útil km'}); }
  if (c.vidaMeses && c.fechaMontaje) { r.pct = Math.max(r.pct, daysBetween(c.fechaMontaje, hoy) / (c.vidaMeses * 30.44)); cand.push({fecha: addMonths(c.fechaMontaje, c.vidaMeses), m: 'antigüedad'}); }
  // Predictivo por mediciones (regresión lineal valor ~ km)
  const m = c.medida;
  if (m && m.limite != null) {
    const pts = (c.lecturas || []).filter(l => l.km != null && l.valor != null).map(l => [l.km, l.valor]);
    if (m.nuevo != null && c.kmMontaje != null) pts.unshift([c.kmMontaje, m.nuevo]);
    if (pts.length) {
      const lastV = pts.sort((a, b) => a[0] - b[0])[pts.length - 1][1];
      if (m.nuevo != null && m.nuevo !== m.limite) r.pct = Math.max(r.pct, (m.nuevo - lastV) / (m.nuevo - m.limite));
    }
    if (pts.length >= 2) {
      const n = pts.length, sx = pts.reduce((a, p) => a + p[0], 0), sy = pts.reduce((a, p) => a + p[1], 0);
      const sxx = pts.reduce((a, p) => a + p[0] * p[0], 0), sxy = pts.reduce((a, p) => a + p[0] * p[1], 0);
      const den = n * sxx - sx * sx;
      if (den) { const b = (n * sxy - sx * sy) / den, a = (sy - b * sx) / n; if (b < 0) { cand.push({km: (m.limite - a) / b, m: 'tendencia de medidas'}); } }
    }
  }
  let best = null;
  for (const x of cand) {
    const f = x.fecha || (km != null ? addDays(hoy, Math.round((x.km - km) / kd)) : null);
    if (f && (!best || f < best.f)) best = {f, km: x.km ?? (km != null ? km + daysBetween(hoy, x.fecha) * kd : null), m: x.m};
  }
  if (best) { r.estFecha = best.f; r.estKm = best.km; r.motivo = best.m; }
  const d = r.estFecha ? daysBetween(hoy, r.estFecha) : null;
  if (r.pct >= 1 || (d != null && d <= 0)) r.status = 'bad';
  else if (r.pct >= 0.85 || (d != null && d <= Math.max(cfg('avisoDias'), 60))) r.status = 'warn';
  else if (cand.length || r.pct > 0) r.status = 'ok';
  return r;
}
const svcCost = s => (s.lineas || []).reduce((a, l) => a + (l.cant || 1) * (l.precio || 0), 0) + (s.manoObra || 0);
function allCosts(v = curV()) {
  const rows = of('services', v).map(s => ({fecha: s.fecha, km: s.km, cat: s.tipo === 'correctivo' ? 'Reparaciones' : s.tipo === 'predictivo' ? 'Predictivo / diagnosis' : 'Mantenimiento', concepto: s.titulo, importe: svcCost(s), ref: s.id}));
  of('expenses', v).forEach(e => rows.push({fecha: e.fecha, km: e.km, cat: e.categoria, concepto: e.concepto, importe: e.importe || 0, ref: e.id, exp: true}));
  return rows.sort((a, b) => b.fecha.localeCompare(a.fecha));
}
function alerts(v = curV()) {
  if (!v) return [];
  const a = [];
  of('plan', v).filter(p => p.activo !== false).forEach(p => { const st = planStatus(p); if (st.status === 'bad' || st.status === 'warn') a.push({kind: 'plan', item: p, st, status: st.status}); });
  of('components', v).filter(c => c.activo !== false).forEach(c => { const st = compStatus(c); if (st.status === 'bad' || st.status === 'warn') a.push({kind: 'comp', item: c, st, status: st.status}); });
  if (v.itv) { const d = daysBetween(todayISO(), v.itv); if (d <= cfg('avisoDias')) a.push({kind: 'itv', status: d <= 0 ? 'bad' : 'warn', dias: d}); }
  if (v.seguro) { const d = daysBetween(todayISO(), v.seguro); if (d <= cfg('avisoDias')) a.push({kind: 'seguro', status: d <= 0 ? 'bad' : 'warn', dias: d}); }
  return a.sort((x, y) => (x.status === 'bad' ? 0 : 1) - (y.status === 'bad' ? 0 : 1));
}

/* ================= UI básica ================= */
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function sheet({title, body, actions = ''}) {
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet"><div class="sheet-h"><div class="tt">${esc(title)}</div>${actions}<button class="btn sec sm" data-close>✕</button></div><div class="sheet-b">${body}</div></div>`;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) close(); });
  const close = () => { bg.remove(); };
  bg.close = close; document.body.appendChild(bg); fillThumbs(bg); return bg;
}
function ask(msg, okTxt = 'Aceptar', danger = false) {
  return new Promise(res => {
    const s = sheet({title: 'Confirmar', body: `<p style="margin:4px 2px 16px">${esc(msg)}</p><div class="grid2"><button class="btn sec" data-r="0">Cancelar</button><button class="btn ${danger ? 'bad' : ''}" data-r="1">${esc(okTxt)}</button></div>`});
    s.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { s.close(); res(b.dataset.r === '1'); });
    s.querySelector('[data-close]').addEventListener('click', () => res(false));
  });
}
/* Formulario genérico */
function fieldHTML(f, val) {
  const id = 'f_' + f.k; const v = val ?? f.def ?? '';
  if (f.type === 'row') return `<div class="f2">${f.fields.map(x => fieldHTML(x, f.vals?.[x.k])).join('')}</div>`;
  if (f.type === 'html') return f.html;
  let inp;
  if (f.type === 'select') inp = `<select id="${id}">${f.opts.map(o => { const [ov, ol] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(ov)}" ${String(ov) === String(v) ? 'selected' : ''}>${esc(ol)}</option>`; }).join('')}</select>`;
  else if (f.type === 'textarea') inp = `<textarea id="${id}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
  else if (f.type === 'check') return `<div class="fld"><label class="chk"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}> ${esc(f.l)}</label></div>`;
  else inp = `<input id="${id}" type="${f.type === 'num' ? 'text' : (f.type || 'text')}" ${f.type === 'num' ? 'inputmode="decimal"' : ''} value="${esc(v)}" placeholder="${esc(f.ph || '')}">`;
  return `<div class="fld"><label for="${id}">${esc(f.l)}</label>${inp}</div>`;
}
function readField(root, f) {
  const el = root.querySelector('#f_' + f.k); if (!el) return undefined;
  if (f.type === 'check') return el.checked;
  if (f.type === 'num') return f.int ? num(el.value) : dec(el.value);
  return el.value.trim();
}
function form({title, fields, vals = {}, onSave, onDelete, extra = '', after}) {
  const flat = []; fields.forEach(f => f.type === 'row' ? f.fields.forEach(x => flat.push(x)) : flat.push(f));
  fields.forEach(f => { if (f.type === 'row') f.vals = vals; });
  const body = fields.map(f => f.type === 'row' ? fieldHTML(f) : fieldHTML(f, vals[f.k])).join('') + extra +
    `<button class="btn block" id="fSave" style="margin-top:8px">Guardar</button>` + (onDelete ? `<button class="btn bad block" id="fDel" style="margin-top:10px">Eliminar</button>` : '');
  const s = sheet({title, body});
  s.querySelector('#fSave').onclick = async () => {
    const out = {}; flat.forEach(f => { if (f.k) out[f.k] = readField(s, f); });
    for (const f of flat) if (f.req && (out[f.k] === '' || out[f.k] == null)) { toast('Falta: ' + f.l); return; }
    const ok = await onSave(out, s); if (ok !== false) { s.close(); render(); }
  };
  if (onDelete) s.querySelector('#fDel').onclick = async () => { if (await ask('¿Eliminar este registro? No se puede deshacer.', 'Eliminar', true)) { await onDelete(); s.close(); render(); } };
  if (after) after(s);
  return s;
}
/* Editor de fotos dentro de un formulario */
function photoEditor(s, ids) {
  const box = s.querySelector('#phBox'); const list = [...(ids || [])];
  const draw = () => {
    box.innerHTML = `<div class="thumbs">${list.map((id, i) => `<div class="ph"><img data-ph="${id}"><button data-i="${i}">✕</button></div>`).join('')}</div>
      <label class="btn sec sm" style="margin-top:8px">📷 Añadir fotos<input type="file" accept="image/*" multiple hidden></label>`;
    fillThumbs(box);
    box.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => { list.splice(+b.dataset.i, 1); draw(); });
    box.querySelector('input').onchange = async e => { for (const f of e.target.files) { try { list.push(await putPhoto(f)); } catch (er) { toast('No se pudo leer la imagen'); } } draw(); };
  };
  draw(); return list;
}
const photoField = `<div class="fld"><label>Fotografías</label><div id="phBox"></div></div>`;

/* ================= Planes base por vehículo ================= */
// Intervalos orientativos y conservadores: revísalos con el manual / libro de mantenimiento de cada coche.
const PLANES = {
  om612: [
    ['Aceite motor y filtro de aceite', 15000, 12, 'Motor', 'MB 229.3/229.5 · 5W-40 · aprox. 7,5 L con filtro'],
    ['Filtro de aire', 30000, 24, 'Motor', ''],
    ['Filtro de combustible (gasoil)', 60000, 48, 'Motor', 'Purgar y comprobar estanqueidad de retornos'],

function alertRow(a) {

views.km = v => {

  <p class="note">Las intervenciones y averías también cuentan como lecturas para calcular el uso medio.</p>`;
};
function kmChart(v) {
  const p = kmPoints(v); if (p.length < 2) return '';
  const W = 340, H = 130, pad = 28; const t0 = new Date(p[0].fecha).getTime(), t1 = new Date(p[p.length - 1].fecha).getTime() || t0 + 1;
  const k0 = Math.min(...p.map(x => x.km)), k1 = Math.max(...p.map(x => x.km)) || k0 + 1;
  const X = f => pad + (new Date(f).getTime() - t0) / Math.max(1, t1 - t0) * (W - pad - 8), Y = k => H - 18 - (k - k0) / Math.max(1, k1 - k0) * (H - 30);
  return `<div class="card"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del kilometraje">
    <polyline fill="none" stroke="${v.color}" stroke-width="2.5" points="${p.map(x => X(x.fecha) + ',' + Y(x.km)).join(' ')}"/>
    ${p.map(x => `<circle cx="${X(x.fecha)}" cy="${Y(x.km)}" r="2.5" fill="${v.color}"/>`).join('')}
    <text x="${pad}" y="${H - 3}" font-size="10" fill="currentColor" opacity=".6">${fDate(p[0].fecha)}</text>
    <text x="${W - 8}" y="${H - 3}" font-size="10" text-anchor="end" fill="currentColor" opacity=".6">${fDate(p[p.length - 1].fecha)}</text>
    <text x="2" y="${Y(k1) + 4}" font-size="10" fill="currentColor" opacity=".6">${Math.round(k1 / 1000)}k</text>
    <text x="2" y="${Y(k0)}" font-size="10" fill="currentColor" opacity=".6">${Math.round(k0 / 1000)}k</text></svg></div>`;
}
function formOdo(o) {

    h += `<h2>Historial de intervenciones (${list.length})</h2>`;

      h += `<div class="avoid"><table><tr><th colspan="4">${fDate(s.fecha)} · ${fKm(s.km)} · ${esc(s.titulo)} <span style="font-weight:400">(${esc(s.tipo)}${s.taller ? ' · ' + esc(s.taller) : ''})</span></th></tr>
        ${ops.length ? `<tr><td colspan="4"><b>Operaciones:</b> ${ops.map(esc).join(', ')}</td></tr>` : ''}
        ${(s.lineas || []).map(l => `<tr><td>${esc(l.nombre)}</td><td>${esc(l.ref || '')}</td><td>${l.cant ?? 1}</td><td>${fEur((l.cant || 1) * (l.precio || 0))}</td></tr>`).join('')}
        ${s.manoObra ? `<tr><td colspan="3">Mano de obra</td><td>${fEur(s.manoObra)}</td></tr>` : ''}
        <tr><td colspan="3"><b>Total</b></td><td><b>${fEur(svcCost(s))}</b></td></tr>
        ${s.notas ? `<tr><td colspan="4">${esc(s.notas)}</td></tr>` : ''}</table>${await imgs(s.fotos)}</div>`;
    }

  if (ck('rAv')) {

    h += `<h2>Averías (${list.length})</h2>`;

      ${[['Sistema', f.sistema], ['Códigos', f.codigos], ['Síntomas', f.sintomas], ['Diagnóstico', f.diagnostico], ['Solución', f.solucion]].filter(x => x[1]).map(([k, x]) => `<tr><td style="width:22%">${k}</td><td>${esc(x)}</td></tr>`).join('')}</table>${await imgs(f.fotos)}</div>`;

async function shareOrDownload(blob, name, mime) {
  const file = new File([blob], name, {type: mime});
  try { if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); return true; } } catch (e) { if (e.name === 'AbortError') return false; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); return true; } catch (e) { toast('No se pudo exportar en esta vista'); return false; }
}
async function exportBackup(withPhotos) {
  toast('Preparando copia…');
  const data = {}; for (const s of STORES) if (s !== 'photos' && s !== 'meta') data[s] = S[s];
  const out = {app: 'GESCAR', formato: 1, fecha: new Date().toISOString(), meta: {vid: S.meta.vid, cfg: S.meta.cfg, seeded: true}, data, photos: []};
  if (withPhotos) { const ph = DB.mem ? Object.entries(memPhotos).map(([id, blob]) => ({id, blob})) : await DB.all('photos'); for (const p of ph) out.photos.push({id: p.id, d: await blobToDataURL(p.blob)}); }
  const ok = await shareOrDownload(new Blob([JSON.stringify(out)], {type: 'application/json'}), `GESCAR_copia_${todayISO()}.json`, 'application/json');
  if (ok) { await setMeta('lastBackup', new Date().toISOString()); render(); }
}
async function importBackup(file) {
  if (!file) return;
  let j; try { j = JSON.parse(await file.text()); } catch (e) { toast('Archivo no válido'); return; }
  if (j.app !== 'GESCAR' || !j.data) { toast('No es una copia de GESCAR'); return; }
  const n = (j.data.services || []).length;
  if (!await ask(`Restaurar la copia del ${fDate(j.fecha.slice(0, 10))} (${(j.data.vehicles || []).length} vehículos, ${n} intervenciones). Se SUSTITUIRÁN los datos actuales.`, 'Restaurar', true)) return;
  for (const s of STORES) await DB.clear(s);
  for (const s of STORES) if (s !== 'photos' && s !== 'meta') { S[s] = []; for (const r of j.data[s] || []) await save(s, r); }
  for (const p of j.photos || []) { const blob = await dataURLToBlob(p.d); if (DB.mem) memPhotos[p.id] = blob; else await DB.put('photos', {id: p.id, blob}); }
  S.meta = {}; for (const [k, v] of Object.entries(j.meta || {})) await setMeta(k, v);
  await setMeta('lastBackup', j.fecha);
  toast('Copia restaurada'); location.hash = '#inicio'; render();
}

async function checkNotify() {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted' || S.meta.notifDay === todayISO()) return;
    const lines = []; S.vehicles.forEach(v => { const a = alerts(v); const b = a.filter(x => x.status === 'bad').length, w = a.length - b; if (a.length) lines.push(`${v.alias}: ${b ? b + ' vencidos' : ''}${b && w ? ', ' : ''}${w ? w + ' próximos' : ''}`); });
    if (!lines.length) return;
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    const opt = {body: lines.join('\n'), icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'gescar-avisos'};
    if (reg) await reg.showNotification('GESCAR · Mantenimiento pendiente', opt); else new Notification('GESCAR · Mantenimiento pendiente', opt);
    await setMeta('notifDay', todayISO());
  } catch (e) {}
}
async function exportICS() {
  const ev = []; const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const icsEsc = s => String(s).replace(/[,;\\]/g, m => '\\' + m).replace(/\n/g, '\\n');
  S.vehicles.forEach(v => {
    of('plan', v).filter(p => p.activo !== false).forEach(p => { const st = planStatus(p); if (!st.estFecha) return; const f = (st.estFecha < todayISO() ? todayISO() : st.estFecha).replace(/-/g, '');
      ev.push(`BEGIN:VEVENT\r\nUID:gescar-${p.id}@gescar\r\nDTSTAMP:${stamp}\r\nDTSTART;VALUE=DATE:${f}\r\nSUMMARY:${icsEsc(`🔧 ${v.alias}: ${p.nombre}`)}\r\nDESCRIPTION:${icsEsc(`Previsto por GESCAR. ${st.nextKm ? 'A los ' + fKm(st.nextKm) + '. ' : ''}${st.nextFecha ? 'Límite por tiempo ' + fDate(st.nextFecha) + '.' : ''}`)}\r\nBEGIN:VALARM\r\nTRIGGER:-P7D\r\nACTION:DISPLAY\r\nDESCRIPTION:${icsEsc(p.nombre)}\r\nEND:VALARM\r\nEND:VEVENT`); });
    if (v.itv) ev.push(`BEGIN:VEVENT\r\nUID:gescar-itv-${v.id}@gescar\r\nDTSTAMP:${stamp}\r\nDTSTART;VALUE=DATE:${v.itv.replace(/-/g, '')}\r\nSUMMARY:${icsEsc('📄 ITV ' + v.alias)}\r\nBEGIN:VALARM\r\nTRIGGER:-P15D\r\nACTION:DISPLAY\r\nDESCRIPTION:ITV\r\nEND:VALARM\r\nEND:VEVENT`);
  });
  if (!ev.length) { toast('No hay mantenimientos con fecha prevista'); return; }
  const ics = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//GESCAR//ES\r\nCALSCALE:GREGORIAN\r\n${ev.join('\r\n')}\r\nEND:VCALENDAR\r\n`;
  await shareOrDownload(new Blob([ics], {type: 'text/calendar'}), 'GESCAR_mantenimientos.ics', 'text/calendar');
}

function compPos(c) {

  if (/neum/.test(n)) { const f = /delan/.test(n), l = /izq/.test(n); return {x: l ? 16.5 : 83.5, y: f ? 24.5 : 75.5, lbl: (f ? 'D' : 'T') + (l ? 'I' : 'D')}; }
  if (/pastill|disco|freno/.test(n)) return {x: 50, y: /tras/.test(n) ? 75.5 : 24.5, lbl: /tras/.test(n) ? 'FT' : 'FD'};
  if (/bater/.test(n)) return {x: 50, y: 12, lbl: 'BAT'};
  return null;
}

const PLAN_RULES = [
  [/filtro\s*(de\s*)?aceite|aceite\s*(de\s*)?motor|cambio\s*(de\s*)?aceite|\b\d{1,2}\s*w\s*-?\s*\d{2}\b|lubricante\s*motor|229\.[35]|b71\s*2290/i, /^aceite motor/i],
  [/filtro\s*(de\s*)?(gas[oó]il|gas[oó]leo|combustible|diesel|di[eé]sel)/i, /filtro de (combustible|gasoil)/i],
  [/filtro\s*(de\s*)?(habit|polen|antipolen|cabina|carb[oó]n)/i, /habit[aá]culo/i],
  [/filtro\s*(de\s*)?aire/i, /^filtro de aire/i],
  [/l[ií]quido\s*(de\s*)?fren|dot\s*-?\s*4|purga.*fren/i, /l[ií]quido de frenos/i],
  [/pastilla|disco.*fren|fren.*disco|zapata|mordaza|pinza\s*de\s*freno/i, /pastillas y discos/i],

    if (byName(o.nombre)) continue;   // ya existe (p. ej. creada por otra factura del mismo lote)

    await save('plan', {id: uid(), vehicleId: F.vid, nombre: o.nombre, sistema: o.sistema || 'Otros', intKm: num(o.intervalo_km), intMeses: num(o.intervalo_meses), notas: (o.motivo || '') + ' · Añadida desde factura ' + (F.numero || ''), activo: true, baseFecha: F.fecha, baseKm: F.km});

  const lineas = F.lineas.filter(l => l.tipo !== 'mano_obra').map(l => ({nombre: l.descripcion, ref: l.referencia, cant: l.cantidad || 1, precio: Math.round((l.importe || 0) / (l.cantidad || 1) * 10000) / 10000, compId: (l.componente_ids || [])[0] || ''}));

  const rec = {id: uid(), vehicleId: F.vid, fecha: F.fecha, km: F.km, tipo: F.tipo, titulo: F.titulo, taller: F.taller,

  }

  for (const m of F.meds || []) { const c = S.components.find(x => x.id === m.compId); if (!c) continue; c.lecturas = [...(c.lecturas || []).filter(l => !(l.fecha === F.fecha && l.km === F.km)), {fecha: F.fecha, km: F.km, valor: m.valor}].sort((a, b) => (a.km || 0) - (b.km || 0)); await save('components', c); }

}

async function importInvoices(files, separate) {

  const s = sheet({title: 'Analizando factura', body: `<div style="text-align:center;padding:10px 0 4px">${ringHTML(0, 96)}<p id="fxSt" style="margin:14px 0 4px">Preparando ${files.length} archivo(s)…</p><p class="note" id="fxSt2">Lectura dato a dato: taller, fecha, km, líneas, referencias, importes e IVA</p></div><div class="bar"><i id="fxBar" style="width:5%;animation:none;transition:width .6s"></i></div>`});
  const st = t => s.querySelector('#fxSt').textContent = t, bar = p => s.querySelector('#fxBar').style.width = p + '%';
  s.querySelector('.ring .c b').innerHTML = ico('doc'); s.querySelector('.ring .c b').style.cssText = 'width:34px;height:34px;color:var(--gold)';
  const ring = s.querySelector('.ring .val'); ring.style.transition = 'none'; ring.style.animation = 'spinring 1.4s linear infinite'; ring.style.strokeDashoffset = 2 * Math.PI * 52 * .7;

      plan: S.plan.filter(p => p.vehicleId === v.id && p.activo !== false).map(p => ({id: p.id, operacion: p.nombre})),
      componentes: S.components.filter(c => c.vehicleId === v.id && c.activo !== false).map(c => ({id: c.id, nombre: c.nombre}))}))) }];
    const docs = [];

  }
}
function snapshot() { const o = {}; S.vehicles.forEach(v => { const a = alerts(v); o[v.id] = {h: health(v), bad: a.filter(x => x.status === 'bad').length, warn: a.filter(x => x.status === 'warn').length, sin: of('plan', v).filter(p => p.activo !== false && !lastDone(p)).length}; }); return o; }

let PENDING = [];
async function markImported(id) { const l = new Set(S.meta.importados || []); l.add(id); await setMeta('importados', [...l]); PENDING = PENDING.filter(f => f.id_import !== id); }
async function checkPending() {
  if (!location.protocol.startsWith('http')) return;
  try { const r = await fetch('importar/pendientes.json?t=' + Date.now(), {cache: 'no-store'}); if (!r.ok) return; const j = await r.json();
    const done = new Set(S.meta.importados || []);
    // lecturas de cuentakilómetros preparadas: se aplican solas
    for (const l of (j.lecturas_km || []).filter(l => l.id_import && !done.has(l.id_import))) {
      const n = String(l.vehiculo || '').toLowerCase(); const v = S.vehicles.find(v => n.includes('picasso') ? /picasso/i.test(v.modelo + v.alias) : n.includes('clk') ? /clk/i.test(v.modelo + v.alias) : false);
      if (v && num(l.km) != null) { await save('odometer', {id: uid(), vehicleId: v.id, fecha: l.fecha, km: num(l.km), nota: l.nota || 'Lectura indicada a Claude'}); await markImported(l.id_import); toast(`${v.alias}: ${fKm(num(l.km))} registrados`); }
    }

    render();

}

      {type: 'html', html: photoField},
    ],
    after: s => { P = photoEditor(s, d.fotos); const lab = s.querySelector('#phBox label'); if (lab) lab.firstChild.textContent = '📷 Fotografiar / añadir páginas'; },
    onSave: async o => {
      for (const id of (d.fotos || [])) if (!P.includes(id)) await delPhoto(id);
      const rec = {...d, ...o, fotos: P, id: d.id || uid()}; await save('docs', rec);
      if (rec.tipo === 'itv' && rec.caducidad && (!v.itv || rec.caducidad >= v.itv)) { v.itv = rec.caducidad; await save('vehicles', v); }
      toast('Documento guardado');
    },
    onDelete: isNew ? null : async () => { for (const id of d.fotos || []) await delPhoto(id); await remove('docs', d.id); },
  });
}

/* ---------- Documentos protegidos preparados por Claude (cifrados AES-GCM) ---------- */
const b64ToBytes = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
async function decryptBundle(j, pass) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass.trim()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64ToBytes(j.salt), iterations: j.iter, hash: 'SHA-256'}, km, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64ToBytes(j.iv)}, key, b64ToBytes(j.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
function pendingDocsBox() {
  if (!PENDING_DOCS) return '';
  return `<div class="card rv" style="background:linear-gradient(135deg,rgba(201,169,110,.22),rgba(201,169,110,.05));border-color:rgba(201,169,110,.45)">
    <div class="row"><span class="tile">${ico('shield')}</span><div class="grow"><div style="font-weight:600">${esc(PENDING_DOCS.titulo || 'Documentos preparados por Claude')}</div><div class="note">Protegidos con clave: contienen datos personales.</div></div></div>
    <button class="btn block" style="margin-top:12px" onclick="unlockDocs()">${ico('check', 2)} Introducir clave y guardar</button></div>`;
}
function unlockDocs() {
  const s = sheet({title: 'Documentos protegidos', body: `<p style="margin-top:0">Introduce la clave que te dio Claude en el chat. Los documentos se descifran y se guardan solo en este iPhone.</p>
    <div class="fld"><label>Clave</label><input id="dkPass" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="palabra-palabra-palabra-0000"></div>
    <button class="btn block" id="dkGo">Descifrar y guardar</button><p class="note" id="dkMsg" style="margin-top:10px"></p>`});
  s.querySelector('#dkGo').onclick = async () => {
    const msg = s.querySelector('#dkMsg'); msg.textContent = 'Descifrando…';
    let data; try { data = await decryptBundle(PENDING_DOCS, s.querySelector('#dkPass').value); } catch (e) { msg.innerHTML = '<span style="color:var(--bad)">Clave incorrecta.</span>'; return; }
    try { const n = await importDocsBundle(data); await markImported(PENDING_DOCS.id_import); PENDING_DOCS = null; s.close(); toast(`${n} documento(s) guardados`);
      const dv = vehByName((data.documentos || [])[0]?.vehiculo); if (dv) await setMeta('vid', dv.id); location.hash = '#documentos'; render(); }
    catch (e) { console.error(e); msg.innerHTML = '<span style="color:var(--bad)">Error al guardar: ' + esc(e.message) + '</span>'; }
  };
}
const vehByName = n => { n = String(n || '').toLowerCase(); return S.vehicles.find(v => n.includes('picasso') ? /picasso/i.test(v.modelo + v.alias) : n.includes('clk') ? /clk/i.test(v.modelo + v.alias) : false); };
async function importDocsBundle(data) {
  let n = 0;
  for (const dv of data.vehiculos || []) { const v = vehByName(dv.vehiculo); if (!v) continue; let ch = false;
    for (const [k, val] of Object.entries(dv.campos || {})) if (val && (!v[k] || dv.sobrescribir?.includes(k))) { v[k] = val; ch = true; }
    if (dv.campos?.itv && (!v.itv || dv.campos.itv > v.itv)) { v.itv = dv.campos.itv; ch = true; }
    if (ch) await save('vehicles', v); }
  for (const d of data.documentos || []) { const v = vehByName(d.vehiculo); if (!v) continue;
    if (S.docs.some(x => x.origen === d.id_import)) continue;
    const fotos = []; for (const u of d.fotos || []) { const blob = await dataURLToBlob(u); const id = 'ph_' + uid(); if (DB.mem) memPhotos[id] = blob; else await DB.put('photos', {id, blob}); fotos.push(id); }
    await save('docs', {id: uid(), vehicleId: v.id, tipo: d.tipo, titulo: d.titulo, fecha: d.fecha, caducidad: d.caducidad || null, notas: d.notas || '', datos: d.datos || null, fotos, origen: d.id_import}); n++; }
  for (const l of data.lecturas_km || []) { const v = vehByName(l.vehiculo); if (v && !S.odometer.some(o => o.vehicleId === v.id && o.fecha === l.fecha)) await save('odometer', {id: uid(), vehicleId: v.id, fecha: l.fecha, km: l.km, nota: l.nota || ''}); }
  for (const g of data.gastos || []) { const v = vehByName(g.vehiculo); if (v && !S.expenses.some(e => e.origen === g.id_import)) await save('expenses', {id: uid(), vehicleId: v.id, fecha: g.fecha, km: g.km, categoria: g.categoria, concepto: g.concepto, importe: g.importe, origen: g.id_import}); }
  for (const a of data.avisos || []) { const v = vehByName(a.vehiculo); if (v && !S.faults.some(f => f.origen === a.id_import)) await save('faults', {id: uid(), vehicleId: v.id, fecha: a.fecha, km: a.km, titulo: a.titulo, sistema: a.sistema, gravedad: a.gravedad || 'leve', estado: 'diagnostico', sintomas: a.sintomas || '', fotos: [], origen: a.id_import}); }
  return n;
}

/* Botón + y arranque */
$('#fab').innerHTML = ico('plus', 2);
document.querySelectorAll('#tabs [data-ic]').forEach(i => i.outerHTML = ico(i.dataset.ic));
(async function init() {
  await DB.open();
  if (DB.mem) toast('Aviso: este navegador no permite guardar datos.');
  try { await load(); } catch (e) { console.error(e); }
  await seed();
  for (const v of S.vehicles) if (!v.carroceria) { v.carroceria = bodyKind(v); await save('vehicles', v); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').then(() => checkNotify()).catch(() => checkNotify());
  else checkNotify();
  checkPending();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); checkPending(); } });
})();
